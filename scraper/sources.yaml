# SanatRadar web kaynaklari
#
# Yeni kaynak eklemek icin ayni kalibi kopyala. "item" alani, liste
# sayfasindaki etkinlik linklerini secen CSS secicisidir. Ilk calistirmadan
# sonra Actions logunda her kaynagin kac etkinlik verdigini gor; 0 veren
# olursa seciciyi birlikte inceltiriz.
#
# NOT: Bu seciciler baslangic degerleridir; siteler tasarim degistirdikce
# guncellenmeleri gerekebilir (uygulamaya dokunmadan, sadece bu dosyada).

# ------------------- ISTANBUL -------------------
- name: İBB Kültür Sanat
  city: İstanbul
  lat: 41.01
  lng: 28.98
  url: https://kultursanat.istanbul/etkinliklerimiz
  base: https://kultursanat.istanbul
  item: "a[href*='etkinlik']"
  max_detail: 12

- name: Kültür İstanbul
  city: İstanbul
  lat: 41.01
  lng: 28.98
  url: https://kultur.istanbul/etkinlikler/
  base: https://kultur.istanbul
  item: "article a, .event a, a[href*='etkinlik']"
  max_detail: 10

# Ulusal sanat takvimi (cogu Istanbul; basliktan sehir ayrimi yapilamadigi
# icin Istanbul olarak etiketlenir)
- name: Artful Living Takvim
  city: İstanbul
  lat: 41.01
  lng: 28.98
  url: https://www.artfulliving.com.tr/takvim/liste
  base: https://www.artfulliving.com.tr
  item: "a[href*='/takvim/']"
  category: sergi
  max_detail: 10

